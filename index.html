<div class="player">
  <h2>🎧 YouTube Audio Player</h2>

  <input
    id="urlInput"
    type="text"
    placeholder="Pega la URL de YouTube"
  />

  <div class="controls">
    <button class="warning" onclick="seek(-10)">⏪</button>
    <button onclick="play()">▶</button>
    <button onclick="pause()">⏸</button>
    <button onclick="stop()">⏹</button>
    <button class="warning" onclick="seek(10)">⏩</button>
  </div>

  <div class="volume">
    🔈
    <input
      type="range"
      min="0"
      max="100"
      value="50"
      oninput="setVolume(this.value)"
    />
    🔊
  </div>

  <button class="secondary" style="margin-top:15px" onclick="loadVideo()">
    Cargar vídeo
  </button>
</div>

<div id="player"></div>
